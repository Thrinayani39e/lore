<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Lore</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232733;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #7c9eff;
    --accent-dim: #2a3350;
    --good: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px var(--good);
  }
  .ingest-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  input, button, textarea {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
  }
  input { width: 220px; }
  button {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    cursor: pointer;
  }
  button:hover { background: var(--accent); color: #0b0d12; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }
  section {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .section-title {
    padding: 12px 20px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .feed {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .flag-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 8px;
    padding: 12px 14px;
    animation: slidein 0.25s ease;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .flag-card .path {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .flag-card .msg { font-size: 13px; line-height: 1.5; }
  .flag-card .cites { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .flag-card .cites a {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .flag-card .cites a:hover { color: var(--accent); border-color: var(--accent); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }
  .chat {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-row { font-size: 13px; line-height: 1.6; }
  .msg-row.user { color: var(--muted); }
  .msg-row.lore .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .chat-input input { flex: 1; width: auto; }
  .badge {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 5px;
    margin-left: 8px;
  }
</style>
</head>
<body>

<header>
  <h1><img src="/logo.png" alt="" width="24" height="24" style="border-radius:6px;vertical-align:middle" /> Lore <span class="dot"></span> <span class="badge">ambient institutional memory</span></h1>
  <div class="ingest-row">
    <input id="repoInput" placeholder="owner/repo" />
    <button id="ingestBtn">Ingest repo</button>
    <span id="ingestStatus" style="font-size:12px;color:var(--muted)"></span>
  </div>
</header>

<main>
  <section>
    <div class="section-title">Live flags</div>
    <div class="feed" id="feed">
      <div class="empty">No flags yet. Edit a file in the watched repo to see Lore speak up.</div>
    </div>
  </section>

  <section class="chat">
    <div class="section-title">Ask Lore</div>
    <div class="messages" id="messages">
      <div class="empty">Ask anything about this repo's history — "why is X built this way?"</div>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Ask about this repo's history..." />
      <button id="chatBtn">Ask</button>
    </div>
  </section>
</main>

<script>
const API = "";

function citationLinks(citations) {
  if (!citations || !citations.length) return "";
  return '<div class="cites">' + citations
    .filter(c => c.url)
    .map(c => `<a href="${c.url}" target="_blank">[${c.index ?? ""}] ${c.title || c.kind}</a>`)
    .join("") + "</div>";
}

function addFlag(flag) {
  const feed = document.getElementById("feed");
  const empty = feed.querySelector(".empty");
  if (empty) empty.remove();
  const card = document.createElement("div");
  card.className = "flag-card";
  card.innerHTML = `
    <div class="path">${flag.file_path}</div>
    <div class="msg">${flag.message}</div>
    ${citationLinks(flag.citations)}
  `;
  feed.prepend(card);
}

async function loadFlags() {
  const res = await fetch(`${API}/flags`);
  const flags = await res.json();
  flags.reverse().forEach(addFlag);
}

function streamFlags() {
  const es = new EventSource(`${API}/flags/stream`);
  es.onmessage = (e) => addFlag(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(streamFlags, 3000); };
}

function addMessage(role, html) {
  const box = document.getElementById("messages");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;
  row.innerHTML = role === "lore" ? `<div class="bubble">${html}</div>` : html;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

async function ask() {
  const input = document.getElementById("chatInput");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  addMessage("user", `<strong>You:</strong> ${question}`);
  addMessage("lore", "Thinking...");
  const res = await fetch(`${API}/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  const data = await res.json();
  document.querySelectorAll(".msg-row.lore .bubble").forEach(el => {
    if (el.textContent === "Thinking...") {
      el.innerHTML = data.answer.replace(/\n/g, "<br/>") + citationLinks(data.citations);
    }
  });
}

document.getElementById("chatBtn").addEventListener("click", ask);
document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

document.getElementById("ingestBtn").addEventListener("click", async () => {
  const repo = document.getElementById("repoInput").value.trim();
  if (!repo) return;
  const status = document.getElementById("ingestStatus");
  status.textContent = "Ingesting...";
  await fetch(`${API}/ingest`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ repo }),
  });
  status.textContent = "Ingesting in background — ask Lore in a bit.";
});

loadFlags();
streamFlags();
</script>

</body>
</html>
