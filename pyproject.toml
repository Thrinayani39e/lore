[project]
name = "lore"
version = "0.1.0"
description = "Ambient institutional memory for engineering teams — an always-on teammate that has read your repo's entire history and speaks up when it matters."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
